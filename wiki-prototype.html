<style>

    --line: rgba(30,42,50,0.16); --bg: var(--parchment); --fg: var(--ink);
    --panel-bg: rgba(231,225,208,0.94); --shadow: 0 12px 34px -18px rgba(20,24,20,0.4);
    --focus: #2f7dd1; --link: var(--rust);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eee7d6; --ink-soft: #b7ae9a; --parchment: #171e22; --parchment-hi: #202a2f;
      --rust: #e07354; --ochre: #d9a441; --verdigris: #7fa294; --fog: #8b8879;
      --line: rgba(238,231,214,0.16); --bg: var(--parchment); --fg: var(--ink);
      --panel-bg: rgba(23,30,34,0.9); --shadow: 0 12px 40px -18px rgba(0,0,0,0.7); --link: var(--rust);
    }
  }
  :root[data-theme="dark"] {
    --ink: #eee7d6; --ink-soft: #b7ae9a; --parchment: #171e22; --parchment-hi: #202a2f;
    --rust: #e07354; --ochre: #d9a441; --verdigris: #7fa294; --fog: #8b8879;
    --line: rgba(238,231,214,0.16); --bg: var(--parchment); --fg: var(--ink);
    --panel-bg: rgba(23,30,34,0.9); --shadow: 0 12px 40px -18px rgba(0,0,0,0.7); --link: var(--rust);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  a { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 40%, transparent); }
  a:hover { border-bottom-color: var(--link); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .shell { max-width: 760px; margin: 0 auto; padding: 0 1.2rem 4rem; }

  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--panel-bg); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 0.8rem 1.2rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  header.top .brand {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.05rem;
    color: var(--fg); border: none; cursor: pointer; background: none; padding: 0;
  }
  header.top .kicker { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--fog); text-transform: uppercase; }
  header.top .top-nav { margin-left: auto; display: flex; gap: 0.8rem; flex-shrink: 0; }

  main { padding-top: 1.6rem; }

  .badge {
    display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 0.62rem;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--fog);
    border: 1px solid var(--line); border-radius: 20px; padding: 0.15rem 0.6rem; margin-bottom: 0.7rem;
  }

  h1.entity-title { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 0 0 0.3rem; text-wrap: balance; }
  .subtitle { color: var(--fog); font-size: 0.85rem; margin: 0 0 1.2rem; font-family: "IBM Plex Mono", monospace; }

  .infobox {
    float: right; width: 220px; margin: 0 0 1rem 1.4rem;
    background: var(--panel-bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 0.9rem 1rem; box-shadow: var(--shadow); font-size: 0.78rem;
  }
  .infobox dt { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fog); margin-top: 0.6rem; }
  .infobox dt:first-child { margin-top: 0; }
  .infobox dd { margin: 0.15rem 0 0; line-height: 1.4; }
  .infobox .tag { display: inline-block; margin: 0.15rem 0.25rem 0 0; }
  @media (max-width: 600px) { .infobox { float: none; width: auto; margin: 0 0 1.2rem; } }

  section.body p { font-size: 0.94rem; line-height: 1.68; margin: 0 0 1rem; }
  h2.section-head {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.15rem;
    margin: 1.6rem 0 0.7rem; padding-top: 0.8rem; border-top: 1px solid var(--line);
  }

  .event {
    padding: 0.7rem 0; border-bottom: 1px dashed var(--line);
  }
  .event:last-child { border-bottom: none; }
  .event .when { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--rust); }
  .event .what { font-weight: 600; margin: 0.15rem 0 0.3rem; }
  .event p { font-size: 0.86rem; color: var(--ink-soft); margin: 0; line-height: 1.6; }
  .cite { font-size: 0.7rem; color: var(--fog); margin-top: 0.35rem; }

  .index-group h2 { font-family: "Fraunces", Georgia, serif; font-size: 1.1rem; margin: 1.6rem 0 0.6rem; }
  .index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.4rem 1rem; }
  .index-grid a { font-size: 0.88rem; }

  .index-search { margin: 0 0 1.4rem; }
  .index-search input {
    width: 100%; font-family: "Public Sans", sans-serif; font-size: 0.92rem;
    padding: 0.6rem 0.9rem; border-radius: 20px; border: 1px solid var(--line);
    background: var(--parchment-hi); color: var(--fg);
  }
  .index-search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }

  .home-hero { text-align: center; padding: 1.3rem 0 1.6rem; display: flex; flex-direction: column; align-items: center; gap: 0.7rem; }
  .home-hero .kicker { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rust); }
  .home-hero .hero-flip-btn {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--ink); color: var(--parchment-hi); border: none; border-radius: 20px;
    padding: 0.5rem 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
  }
  .home-hero .hero-flip-btn:hover { background: var(--rust); }

  .not-found { padding: 2rem 0; color: var(--fog); }
  footer.note { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.68rem; color: var(--fog); line-height: 1.6; font-family: "IBM Plex Mono", monospace; }

  /* ---- network view (namespaced under .netview so nothing here can collide with the
     article/index styles above — it reuses the same colour tokens and type system) ---- */

  /* Network is the front door and needs real width for the graph, unlike the prose column
     everything else uses -- widen the shell and tighten the vertical padding around it only
     when a .netview is present, via :has() rather than a body-class toggle in JS. Sized so the
     graph+info pane fills the viewport below the header without the page itself scrolling --
     the graph pans/zooms internally and the info panel scrolls on its own, same as any app
     sidebar, but the outer page shouldn't need a second scrollbar on top of that. */
  .shell:has(.netview) { max-width: 1400px; padding-bottom: 1rem; }
  main:has(.netview) { padding-top: 0.9rem; }

  .netview .net-graph-face {
    display: flex; height: calc(100vh - 5.5rem); min-height: 420px;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
  }
  .netview .net-graph-wrap { flex: 1 1 auto; position: relative; min-width: 0; background: var(--parchment-hi); }
  .netview .net-graph-wrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .netview .net-graph-wrap svg:active { cursor: grabbing; }
  .netview .net-graph-toolbar { position: absolute; top: 0.7rem; left: 0.7rem; display: flex; gap: 0.4rem; z-index: 3; }
  .netview .net-zoom-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-bg);
    color: var(--fg); font-family: "IBM Plex Mono", monospace; font-size: 0.9rem; cursor: pointer; line-height: 1;
  }
  .netview .net-zoom-btn:hover { background: var(--rust); color: var(--parchment-hi); }
  .netview .net-zoom-btn.wide { width: auto; padding: 0 0.5rem; border-radius: 14px; font-size: 0.75rem; }
  .netview .net-zoom-btn.active { background: var(--rust); color: var(--parchment-hi); border-color: var(--rust); }
  /* The two stamps Nick asked to distribute through the project -- deliberately NOT links. He
     wants them to work as a fishhook: a reader who wants to know what "Reinstate Resolution
     3379" actually means has to go search for it themselves (the search box right below finds
     both instantly), not get the answer handed over on a click. Styled like the old
     "PROTOTYPE · NOT LIVE" stamp this whole idea grew out of: rotated, bordered, stamped-on. */
  .netview .net-stamps { position: absolute; top: 0.7rem; right: 0.7rem; z-index: 3; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; }
  .netview .net-stamp-tag {
    font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--rust); border: 1px solid color-mix(in srgb, var(--rust) 55%, transparent);
    border-radius: 3px; padding: 0.3rem 0.65rem; background: var(--panel-bg); box-shadow: var(--shadow);
    transform: rotate(var(--r)); white-space: nowrap; display: inline-block; user-select: none;
  }
  @media (max-width: 500px) { .netview .net-stamp-tag { font-size: 0.55rem; padding: 0.24rem 0.5rem; } }
  .netview .net-graph-legend {
    position: absolute; bottom: 0.6rem; left: 0.6rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.7rem;
    font-family: "IBM Plex Mono", monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--ink-soft); background: var(--panel-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0.32rem 0.55rem;
    max-width: calc(100% - 1.2rem);
  }
  .netview .net-legend-sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 0.1rem; }
  .netview .net-graph-legend .net-sw { display: inline-flex; align-items: center; gap: 0.28rem; white-space: nowrap; }
  .netview .net-graph-legend .net-sw em { font-style: normal; color: var(--fog); }
  .netview .net-graph-legend .net-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--fog); flex-shrink: 0; }
  .netview .net-graph-legend .net-dot.ring { background: none; border: 1.2px solid var(--fog); }
  .netview svg.net-shico { width: 10px !important; height: 10px !important; fill: var(--ink-soft); flex-shrink: 0; display: inline-block; }

  .netview .net-info-panel { flex: 0 0 340px; border-left: 1px solid var(--line); background: var(--panel-bg); display: flex; flex-direction: column; min-height: 0; }
  .netview .net-panel-search { position: relative; padding: 0.8rem 0.9rem 0.6rem; border-bottom: 1px solid var(--line); flex: none; }
  .netview .net-panel-search input {
    width: 100%; font-family: "Public Sans", sans-serif; font-size: 0.82rem;
    padding: 0.42rem 0.7rem; border-radius: 20px; border: 1px solid var(--line); background: var(--parchment-hi); color: var(--fg);
  }
  .netview .net-panel-search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .netview .net-search-results {
    position: absolute; left: 0.9rem; right: 0.9rem; top: calc(100% - 0.2rem); z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto;
  }
  .netview .net-sr-item { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.82rem; }
  .netview .net-sr-item:hover { background: var(--parchment-hi); }
  .netview .net-sr-kind { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; color: var(--fog); }
  .netview .net-sr-empty { padding: 0.6rem 0.7rem; font-size: 0.78rem; color: var(--fog); }
  .netview #netInfoPanel { flex: 1 1 auto; overflow-y: auto; padding: 1.1rem 1.2rem 2rem; min-height: 0; }
  .netview .net-info-empty { color: var(--fog); font-size: 0.85rem; padding-top: 2rem; text-align: center; line-height: 1.6; }
  .netview .net-info-empty .big { font-size: 1.6rem; display: block; margin-bottom: 0.5rem; }
  @media (max-width: 860px) {
    .netview .net-info-empty { padding-top: 0.5rem; font-size: 0.78rem; line-height: 1.4; }
    .netview .net-info-empty .big { font-size: 1.2rem; margin-bottom: 0.25rem; }
  }
  .netview .net-info-badge { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.15rem 0.55rem; border-radius: 20px; margin-bottom: 0.6rem; border: 1px solid var(--line); }
  .netview .net-info-panel h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.25rem; margin: 0 0 0.25rem; text-wrap: balance; }
  .netview .net-info-meta { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--fog); margin: 0 0 0.9rem; line-height: 1.5; }
  .netview .net-info-role { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.55; margin: 0 0 1rem; }
  .netview .net-info-section-h { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 0.95rem; margin: 1.1rem 0 0.5rem; padding-top: 0.7rem; border-top: 1px solid var(--line); }
  .netview .net-info-event { padding: 0.55rem 0; border-bottom: 1px dashed var(--line); }
  .netview .net-info-event:last-child { border-bottom: none; }
  .netview .net-info-event .when { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; color: var(--rust); }
  .netview .net-info-event .what { font-weight: 600; font-size: 0.83rem; margin: 0.1rem 0 0.2rem; }
  .netview .net-info-event p { font-size: 0.78rem; color: var(--ink-soft); margin: 0; line-height: 1.55; }
  .netview .net-info-close { background: none; border: 1px solid var(--line); border-radius: 20px; font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; text-transform: uppercase; color: var(--fog); padding: 0.25rem 0.6rem; cursor: pointer; float: right; }
  .netview .net-info-close:hover { color: var(--rust); border-color: var(--rust); }

  @media (max-width: 860px) {
    .netview .net-graph-face { flex-direction: column; height: auto; }
    .netview .net-graph-wrap { height: 42vh; }
    /* Empty-state info panel (nothing selected yet) stays short -- it's just an icon and two
       lines of instructions, no reason to reserve a third of the screen for it. Once a node is
       actually selected there's real content to read, so it's allowed to grow. Toggled via
       .has-selection, set/cleared in netSelectNode/netClearSelection alongside the innerHTML
       swap that already happens there. */
    .netview .net-info-panel { flex: none; border-left: none; border-top: 1px solid var(--line); max-height: 15vh; transition: max-height 0.2s ease; }
    .netview .net-info-panel.has-selection { max-height: 44vh; }
  }

  .net-intro-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1.2rem; background: rgba(20,20,18,0.5); backdrop-filter: blur(2px); animation: netIntroFade 0.25s ease; }
  @keyframes netIntroFade { from { opacity: 0; } to { opacity: 1; } }
  .net-intro-card { max-width: 30rem; background: var(--parchment-hi); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 1.6rem 1.7rem; }
  .net-intro-card .badge { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fog); border: 1px solid var(--line); border-radius: 20px; padding: 0.2rem 0.6rem; margin-bottom: 0.7rem; }
  .net-intro-card h2 { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.35rem; margin: 0 0 0.7rem; text-wrap: balance; }
  .net-intro-card p { font-size: 0.88rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 0.9rem; }
  .net-intro-card .net-intro-ok { display: block; margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--ink); color: var(--parchment); border: none; border-radius: 20px; padding: 0.5rem 1.1rem; cursor: pointer; }
  .net-intro-card .net-intro-ok:hover { opacity: 0.85; }
</style>

    "summary": "The security doctrine, formed in the immediate aftermath of the 1967 Six-Day War, that Israel could not safely return to the pre-war 1949 armistice lines — themselves only a ceasefire boundary, never a negotiated international border — because they left the country strategically indefensible: Syrian artillery on the Golan Heights overlooking the Hula Valley, the Jordanian army within sight of the Mediterranean at the West Bank's narrowest point, Egyptian positions in Gaza close to Israel's population centers. Its architects, by most historical accounts, ran from Yigal Allon and Moshe Dayan in the doctrine's formative years through Yitzhak Rabin and Ariel Sharon in later decades — all but Rabin already profiled elsewhere in this dataset. Foreign Minister Abba Eban gave the doctrine its most quoted public phrase in a November 1969 Der Spiegel interview: 'the June map is for us equivalent to insecurity and danger... it has for us something of a memory of Auschwitz' — since shorthanded as 'Auschwitz borders,' though Eban's own 1993 letter to the Jerusalem Post recalled the phrase originating differently, as a retort to a Soviet diplomat's advice to withdraw ('a people that has suffered the agonies of Auschwitz is not likely to take such suicidal advice'). The same 1969 interview is less often quoted for a second Eban statement made in it: that Israel 'could not and should not retain the occupied territories and should not continue to control one million Arabs' — a qualification frequently dropped when the Auschwitz line is cited on its own.",

  // ---- unified entity index ----
  var entities = {};
  ACTORS.forEach(function (a) { entities["actor:" + a.actor_id] = { kind: "actor", data: a, name: a.full_name }; });
  ORGS.forEach(function (o) { entities["org:" + o.org_id] = { kind: "org", data: o, name: o.name }; });
  MKS.forEach(function (m) { entities["mk:" + m.mk_id] = { kind: "mk", data: m, name: m.full_name }; });
  FOREIGN.forEach(function (f) { entities["foreign:" + f.actor_id] = { kind: "foreign", data: f, name: f.full_name }; });
  LAWS.forEach(function (l) { entities["law:" + l.law_id] = { kind: "law", data: l, name: l.title }; });
  TOPICS.forEach(function (t) { entities["topic:" + t.topic_id] = { kind: "topic", data: t, name: t.name }; });

  // Full-text search blob per entity — the entire underlying record, lowercased, so a search
  // hit isn't limited to the title/aliases: it also catches a person or place *mentioned inside
  // another entity's prose* (e.g. searching "Bilu" should surface the Bilu movement's own page
  // via its name, but also anything that merely references it in passing).
  Object.keys(entities).forEach(function (key) {
    entities[key].searchBlob = JSON.stringify(entities[key].data).toLowerCase();
  });

  // name -> key, for auto-linking prose. Longest names first so "Menachem Begin" wins over "Begin".
  // Also index unique surnames alone ("Begin" as well as "Menachem Begin") since prose
  // naturally refers to people by surname after first mention — that's most of what makes
  // "anyone who comes up in the article" actually work. Skip any surname shared by more than
  // one entity (ambiguous) rather than guess which one prose means. Same idea for orgs whose
  // formal name carries a parenthetical/slash subtitle ("Herut (Freedom Movement)" -> also
  // index "Herut" alone) — otherwise only the full formal name would ever link, and nobody
  // writes "Irgun Tzvai Leumi (Etzel)" in a sentence.
  var PERSON_KINDS = { actor: true, foreign: true, mk: true };
  var MANUAL_ALIASES = { "IDF": "org:idf", "Irgun": "org:irgun", "Land Acquisition Law": "law:land-acquisition-law-1953", "Bilu": "org:bilu-movement" };

  var nameIndex = [];
  var surnameCount = {};
  Object.keys(entities).forEach(function (key) {
    var e = entities[key];
    if (!PERSON_KINDS[e.kind]) return;
    var surname = e.name.split(",")[0].trim().split(" ").pop();
    if (surname && surname.length > 3) {
      surnameCount[surname] = (surnameCount[surname] || 0) + 1;
    }
  });
  Object.keys(entities).forEach(function (key) {
    var e = entities[key];
    var names = [e.name];
    // Deliberately-curated aliases (org/topic "aliases" arrays) bypass the length>3 noise
    // filter below entirely, same as MANUAL_ALIASES -- that filter exists to stop short
    // auto-derived fragments (surnames, split-off name parts) from over-matching, but a
    // curated alias like "WZO"/"JNF"/"KKL" is exactly as deliberate as a MANUAL_ALIASES entry
    // and was silently never linking despite being added specifically to enable this (caught
    // 2026-09-03: JNF/KKL had carried this same 3-character gap since first added).
    var guaranteed = [];
    if (e.data.birth_name && e.data.birth_name !== e.name) names.push(e.data.birth_name);
    if (PERSON_KINDS[e.kind]) {
      var surname = e.name.split(",")[0].trim().split(" ").pop();
      if (surname && surname.length > 3 && surnameCount[surname] === 1) names.push(surname);
    }
    if (e.kind === "org") {
      // "Herut (Freedom Movement)" -> "Herut"; "Bar-Giora / Hashomer" -> "Bar-Giora" + "Hashomer"
      e.name.split("/").forEach(function (part) {
        var short = part.split("(")[0].trim();
        if (short && short !== e.name) names.push(short);
      });
      // Explicit aliases ("Jewish National Fund" -> "JNF", "KKL", "World Zionist Organization"
      // -> "WZO") -- same mechanism as topics, so any org's common abbreviation/other-language
      // name is reachable and auto-links in prose without needing a MANUAL_ALIASES entry.
      if (e.data.aliases) e.data.aliases.forEach(function (al) { guaranteed.push(al); });
    }
    if (e.kind === "law") {
      // "Absentees' Property Law, 5710-1950" -> also index "Absentees' Property Law" alone,
      // since nobody writes the Hebrew-year citation suffix in a sentence.
      var short = e.name.split(",")[0].trim();
      if (short && short !== e.name) names.push(short);
    }
    if (e.kind === "topic" && e.data.aliases) {
      // Some topics are the same event under more than one name prose actually uses
      // ("Resolution 181" / "1947 UN Partition Plan") — index every alias too, so the
      // page is reachable and auto-links under any of them.
      e.data.aliases.forEach(function (al) { guaranteed.push(al); });
    }
    names.forEach(function (n) {
      if (n && n.length > 3) nameIndex.push({ name: n, key: key });
    });
    guaranteed.forEach(function (n) {
      if (n) nameIndex.push({ name: n, key: key });
    });
  });
  Object.keys(MANUAL_ALIASES).forEach(function (alias) {
    nameIndex.push({ name: alias, key: MANUAL_ALIASES[alias] });
  });
  nameIndex.sort(function (a, b) { return b.name.length - a.name.length; });

  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var linkPattern = null;
  function buildPattern() {
    if (linkPattern) return linkPattern;
    var alt = nameIndex.map(function (n) { return escapeRegex(n.name); }).join("|");
    // word boundaries matter here — without them "Peel" would match inside "appeal"/"repeal"
    linkPattern = new RegExp("\\b(" + alt + ")\\b", "g");
    return linkPattern;
  }
  var nameToKey = {};
  nameIndex.forEach(function (n) { if (!nameToKey[n.name]) nameToKey[n.name] = n.key; });

  // Auto-link known entity names inside free text. Skips linking the entity's own page to itself.
  function autolink(text, selfKey, netMode) {
    // netMode routes a mention into the network view's own deep link (#/network/kind/id,
    // selecting the mentioned node in place) instead of that entity's separate full page --
    // used for the network info panel's prose, so following a mention there "swaps to the
    // listing in the web side" the same way the homepage index's own links already do, rather
    // than leaving the graph.
    if (!text) return "";
    var pattern = buildPattern();
    var escaped = escapeHtml(text);
    var prefix = netMode ? "#/network/" : "#/";
    return escaped.replace(pattern, function (match) {
      var key = nameToKey[match];
      if (!key || key === selfKey) return match;
      return '<a href="' + prefix + key.replace(":", "/") + '">' + match + "</a>";
    });
  }

  function linkIfKnownOrg(text) {
    // best-effort match of a free-text affiliation string against a known org name
    for (var i = 0; i < ORGS.length; i++) {
      if (text.indexOf(ORGS[i].name) !== -1) {
        return '<a href="#/org/' + ORGS[i].org_id + '">' + escapeHtml(text) + "</a>";
      }
    }
    return escapeHtml(text);
  }

  // ---- renderers ----
  function renderActor(a) {
    var lifespan = a.life_span ? (a.life_span.born || "?") + " – " + (a.life_span.died || "living") : "";
    var html = '<span class="badge">Historical Actor</span>';
    html += '<div class="infobox"><dt>Born</dt><dd>' + escapeHtml(a.birth_country || "—") + "</dd>";
    html += "<dt>Life span</dt><dd>" + escapeHtml(lifespan) + "</dd>";
    if (a.birth_name && a.birth_name !== a.full_name) html += "<dt>Birth name</dt><dd>" + escapeHtml(a.birth_name) + "</dd>";
    html += "<dt>Affiliations</dt><dd>" + (a.primary_affiliations || []).map(linkIfKnownOrg).join("<br>") + "</dd></div>";
    html += '<h1 class="entity-title">' + escapeHtml(a.full_name) + "</h1>";
    html += '<section class="body"><p>' + autolink(a.historical_role, "actor:" + a.actor_id) + "</p></section>";
    if (a.key_land_actions && a.key_land_actions.length) {
      html += '<h2 class="section-head">Key actions</h2>';
      a.key_land_actions.forEach(function (k) {
        html += '<div class="event"><div class="when">' + escapeHtml(k.date) + " · " + escapeHtml(k.action_type) +
          " · " + escapeHtml(k.location_affected) + '</div><p>' + autolink(k.impact_description, "actor:" + a.actor_id) + "</p>" +
          '<div class="cite">' + escapeHtml(k.primary_source_citation || "") + "</div></div>";
      });
    }
    if (a.personal_context && a.personal_context.length) {
      html += '<h2 class="section-head">Beyond the ledger</h2>';
      a.personal_context.forEach(function (p) {
        html += '<div class="event"><div class="when">' + escapeHtml(p.date_or_range || "") + " · " + escapeHtml(p.title) + '</div>' +
          "<p>" + autolink(p.description, "actor:" + a.actor_id) + "</p>" +
          '<div class="cite">' + escapeHtml(p.citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function renderForeign(f) {
    var html = '<span class="badge">Foreign Patron' + (f.role_status && f.role_status.indexOf("UNCONFIRMED") !== -1 ? " · unconfirmed" : "") + "</span>";
    html += '<div class="infobox"><dt>Role</dt><dd>' + escapeHtml(f.organizational_role || "—") + "</dd>";
    html += "<dt>Organisation</dt><dd>" + linkIfKnownOrg(f.organization || "—") + "</dd>";
    html += "<dt>Operating in</dt><dd>" + (f.operating_countries || []).join(", ") + "</dd></div>";
    html += '<h1 class="entity-title">' + escapeHtml(f.full_name) + "</h1>";
    html += '<section class="body"><p>' + autolink(f.primary_activity_description || "", "foreign:" + f.actor_id) + "</p>";
    if (f.role_status) html += "<p>" + autolink(f.role_status, "foreign:" + f.actor_id) + "</p>";
    if (f.public_registration) html += "<p>" + autolink(f.public_registration, "foreign:" + f.actor_id) + "</p>";
    html += "</section>";
    if (f.action_record && f.action_record.length) {
      html += '<h2 class="section-head">Record</h2>';
      f.action_record.forEach(function (k) {
        html += '<div class="event"><div class="when">' + escapeHtml(k.date) + " · " + escapeHtml(k.action_type) +
          (k.location_affected ? " · " + escapeHtml(k.location_affected) : "") + '</div><p>' + autolink(k.description, "foreign:" + f.actor_id) + "</p>" +
          '<div class="cite">' + escapeHtml(k.citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function renderOrg(o) {
    var html = '<span class="badge">' + escapeHtml(o.org_type || "Organisation") + "</span>";
    html += '<div class="infobox"><dt>Founded</dt><dd>' + escapeHtml(o.founding_date || "—") + "</dd>";
    if (o.dissolution_date) html += "<dt>Dissolved</dt><dd>" + escapeHtml(o.dissolution_date) + "</dd>";
    html += "<dt>Ideology</dt><dd>" + (o.ideology || []).join(", ") + "</dd>";
    var pred = (o.lineage && o.lineage.predecessor_orgs || []).map(function (p) { return orgLink(p); }).join(", ");
    var succ = (o.lineage && o.lineage.successor_orgs || []).map(function (p) { return orgLink(p); }).join(", ");
    if (pred) html += "<dt>Preceded by</dt><dd>" + pred + "</dd>";
    if (succ) html += "<dt>Followed by</dt><dd>" + succ + "</dd>";
    var members = (o.notable_members || []).map(function (m) { return actorLink(m); }).join("<br>");
    if (members) html += "<dt>Notable members</dt><dd>" + members + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(o.name) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(o.hebrew_name || "") + "</p>";
    if (o.action_record && o.action_record.length) {
      html += '<h2 class="section-head">Timeline</h2>';
      o.action_record.forEach(function (e) {
        html += '<div class="event"><div class="when">' + escapeHtml(e.date) + " · " + escapeHtml(e.action_type) + '</div><div class="what">' +
          escapeHtml(e.title) + '</div><p>' + autolink(e.description, "org:" + o.org_id) + "</p>" +
          '<div class="cite">' + escapeHtml(e.citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function orgLink(idOrText) {
    var org = ORGS.find(function (o) { return o.org_id === idOrText; });
    if (org) return '<a href="#/org/' + org.org_id + '">' + escapeHtml(org.name) + "</a>";
    return escapeHtml(idOrText);
  }
  function personLink(id) {
    // people can live in either historical_actors.json ("actor") or knesset_members.json
    // ("mk") — check both rather than assuming, so MK references (e.g. a law's sponsoring

    var e = entities["actor:" + id] || entities["mk:" + id];

  var actorLink = personLink; // legacy name, kept as an alias

  function lawLink(id) {

  function renderMK(m) {

    var terms = (m.knesset_terms || []).map(function (t) {
      return "Knesset " + t.knesset_number + " — " + linkIfKnownOrg(t.party) + " (" + escapeHtml(t.political_alignment) + ")";
    }).join("<br>");
    if (terms) html += "<dt>Knesset terms</dt><dd>" + terms + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(m.full_name) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(m.hebrew_name || "") + "</p>";
    if (m.legislative_and_action_record && m.legislative_and_action_record.length) {
      html += '<h2 class="section-head">Legislative record</h2>';
      m.legislative_and_action_record.forEach(function (r) {
        html += '<div class="event"><div class="when">' + escapeHtml(r.date) + " · " + escapeHtml(r.category) + '</div><div class="what">' +
          autolink(r.bill_or_action_title, "mk:" + m.mk_id) + " — " + escapeHtml(r.vote) + "</div>";
        if (r.land_impact && r.land_impact.description) {

        }
        html += '<div class="cite">' + escapeHtml(r.citation || "") + "</div></div>";
      });
    }
    if (m.personal_context && m.personal_context.length) {
      html += '<h2 class="section-head">Beyond the ledger</h2>';
      m.personal_context.forEach(function (p) {
        html += '<div class="event"><div class="when">' + escapeHtml(p.date_or_range || "") + " · " + escapeHtml(p.title) + '</div>' +
          "<p>" + autolink(p.description, "mk:" + m.mk_id) + "</p>" +
          '<div class="cite">' + escapeHtml(p.citation || "") + "</div></div>";
      });
    }
    return html;

  function renderLaw(l) {
    var html = '<span class="badge">' + escapeHtml(l.category || "Law") + "</span>";
    html += '<div class="infobox">';
    html += "<dt>Enacted</dt><dd>" + escapeHtml(l.enactment_date || "—") + (l.knesset_number ? " · Knesset " + l.knesset_number : "") + "</dd>";
    if (l.sponsoring_ministry) html += "<dt>Sponsoring ministry</dt><dd>" + escapeHtml(l.sponsoring_ministry) + "</dd>";
    if (l.sponsoring_mk_id) html += "<dt>Sponsoring minister</dt><dd>" + personLink(l.sponsoring_mk_id) + "</dd>";
    if (l.official_citation) html += "<dt>Official citation</dt><dd>" + escapeHtml(l.official_citation) + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(l.title) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(l.hebrew_title || "") + "</p>";
    html += '<section class="body"><p>' + autolink(l.summary, "law:" + l.law_id) + "</p></section>";
    if (l.land_impact) {
      html += '<h2 class="section-head">Land impact</h2>';

  function renderIndex() {

    html += '<form class="index-search" onsubmit="return doSearch(event)">';
    html += '<input id="searchbox" type="search" placeholder="Search all entries…" aria-label="Search entities" /></form>';

    // Every index list is alphabetized — browsing by eye (not just searching) is a real way
    // readers find a page, and the order entries happened to be added in isn't a useful sort.
    function byName(key) { return function (x, y) { return x[key].localeCompare(y[key]); }; }
    var orgsSorted = ORGS.slice().sort(byName("name"));
    // Actors, Knesset Members, and Foreign Patrons are one reader-facing category ("Actors") —
    // the three-file split underneath is real (MKs carry scraped floor-vote data, Foreign
    // Patrons a different sourcing standard for non-Israeli figures) but that's a data-
    // provenance distinction, not one a reader needs to navigate around. A person still only
    // lives in exactly one file, so this merge is purely presentational.
    // Every link out of the index opens the entity selected inside the network view (#/network/
    // <kind>/<id>, handled in route()) rather than that entity's separate full page — following a
    // link from the index "swaps to the listing in the web side" rather than leaving it, per Nick.
    var people = ACTORS.map(function (a) { return { name: a.full_name, href: "#/network/actor/" + a.actor_id }; })
      .concat(MKS.map(function (m) { return { name: m.full_name, href: "#/network/mk/" + m.mk_id }; }))
      .concat(FOREIGN.map(function (f) { return { name: f.full_name, href: "#/network/foreign/" + f.actor_id }; }))
      .sort(byName("name"));

    html += "</div></div>";

    html += '<div class="index-group"><h2>Organisations (' + ORGS.length + ")</h2><div class=\"index-grid\">";
    orgsSorted.forEach(function (o) { html += '<a href="#/network/org/' + o.org_id + '">' + escapeHtml(o.name) + "</a>"; });
    html += "</div></div>";

    // Bills, motions and UN Resolutions live in topics.json (their schema fits better — most
    // never passed, so laws.json's enactment-date/sponsoring-MK shape wouldn't apply) but read as
    // legislation to a reader, not as places or events — folded into the same "Legislation" index
    // group as actual Laws rather than left looking like they belong under Places & Events. Their
    // own page still shows the real topic_type (e.g. "Legislative Proposal") so nothing about the
    // underlying distinction is lost, this is a navigation-layer merge only. Nick: "roll Motions,
    // Resolutions and Bills into Laws."
    var legislation = LAWS.map(function (l) { return { name: l.title.split(",")[0], href: "#/network/law/" + l.law_id }; })
      .concat(TOPICS.filter(function (t) { return NET_LAW_LIKE_TOPIC_TYPES[t.topic_type]; })
        .map(function (t) { return { name: t.name, href: "#/network/topic/" + t.topic_id }; }))
      .sort(byName("name"));
    var otherTopics = TOPICS.filter(function (t) { return !NET_LAW_LIKE_TOPIC_TYPES[t.topic_type]; }).sort(byName("name"));

    if (legislation.length) {
      html += '<div class="index-group"><h2>Legislation (' + legislation.length + ")</h2><div class=\"index-grid\">";
      legislation.forEach(function (l) { html += '<a href="' + l.href + '">' + escapeHtml(l.name) + "</a>"; });
      html += "</div></div>";

      html += '<div class="index-group"><h2>Places, Periods &amp; Events (' + otherTopics.length + ")</h2><div class=\"index-grid\">";
      otherTopics.forEach(function (t) { html += '<a href="#/network/topic/' + t.topic_id + '">' + escapeHtml(t.name) + "</a>"; });
      html += "</div></div>";
    }

    return html;
  }

  function renderSearch(q) {
    q = q.toLowerCase();
    // Rank 0: title match. Rank 1: alias match. Rank 2: only a mention somewhere in the
    // entity's own body text (a summary/description that happens to name the search term).
    // The filter itself runs against the full searchBlob, so a mention anywhere is a hit —
    // the rank just controls display order so title/alias matches surface first.
    function rank(e) {
      if (e.name.toLowerCase().indexOf(q) !== -1) return 0;
      if (e.data.aliases && e.data.aliases.some(function (al) { return al.toLowerCase().indexOf(q) !== -1; })) return 1;
      return 2;
    }
    var hits = Object.keys(entities)
      .filter(function (k) { return entities[k].searchBlob.indexOf(q) !== -1; })
      .map(function (k) { return { key: k, rank: rank(entities[k]) }; })
      .sort(function (a, b) { return a.rank - b.rank || entities[a.key].name.localeCompare(entities[b.key].name); });
    var html = '<h1 class="entity-title">Search: "' + escapeHtml(q) + '"</h1>';
    // Same search box as the index, repeated here so a results page isn't a dead end that
    // forces a trip back to #/index just to search again.
    html += '<form class="index-search" onsubmit="return doSearch(event)">';
    html += '<input id="searchbox" type="search" placeholder="Search all entries…" aria-label="Search entities" value="' + escapeHtml(q) + '" /></form>';
    if (!hits.length) { html += '<p class="not-found">No matches.</p>'; return html; }
    html += '<div class="index-grid">';
    hits.forEach(function (hit) {
      var e = entities[hit.key];
      var tag = hit.rank === 2 ? "mentioned" : e.kind;
      html += '<a href="#/' + hit.key.replace(":", "/") + '">' + escapeHtml(e.name) + " <span style='color:var(--fog);font-size:0.75em'>(" + tag + ")</span></a>";
    });
    html += "</div>";
    return html;
  }

  window.doSearch = function (evt) {

  // =========================================================================
  // Network view — the whole archive as a force-directed graph. Ported from
  // prototypes/build_network_view.py + network_view_template.html: same
  // classifier reasoning, same edge rules (structured fields only), just
  // computed client-side from the ACTORS/MKS/ORGS/LAWS/TOPICS/FOREIGN arrays
  // already embedded above, instead of a separately-baked GRAPH_DATA blob.
  // Built lazily on first visit to #/network, not on every page load.
  // =========================================================================
  var NET = { built: false, nodes: null, edges: null, nodeById: null, adjacency: null,
              selectedId: null, showHidden: false, viewBox: null, animToken: 0 };

  var NET_RIGHT_KW = ["revisionist", "greater israel", "territorial maximalism", "national conservatism",
    "iron wall", "neo-zionism", "hadar", "monistic", "free-market", "anti-british revolt",
    "kahanism", "ultranationalism", "far-right", "settlement expansion"];
  var NET_LEFT_KW = ["labor zionism", "socialist zionism", "social democracy", "marxist", "trade unionism",
    "religion of labor", "gordonism", "pragmatic statism"];
  var NET_RELIGIOUS_KW = ["religious zionism"];
  var NET_CENTRIST_KW = ["centrist"];
  var NET_INSTITUTIONAL_TYPES = { "Government Office":1, "Legislative Body":1, "Sovereign State":1,
    "Self-Governing Community":1, "National Military":1, "International Body":1, "Representative Assembly":1,
    "Executive Council":1, "International Zionist Body":1, "Financial Institution":1, "Land Fund":1, "Land Company":1,
    "Intelligence Agency":1 };
  var NET_ALIGNMENT_FIELD_MAP = { "Right": "right", "Far-Right": "right", "Left": "left",
    "Religious Nationalist": "religious", "Center": "centrist" };
  // The Knesset's own "Religious Nationalist" label conflates Religious Zionism with Haredi
  // non-Zionism (UTJ) -- two genuinely different currents this dataset's own org entries
  // already distinguish. Haredi parties are exempted from the field override below so they
  // fall through to org-propagation instead, which resolves UTJ correctly.
  var NET_HAREDI_PARTIES = { "United Torah Judaism": 1 };
  var NET_ALIGN_COLOR = { right: 'var(--rust)', left: 'var(--verdigris)', religious: 'var(--ochre)', centrist: 'var(--focus)',
    institutional: 'var(--fog)', unaffiliated: 'var(--fog)', unclassified: 'var(--fog)' };
  var NET_ALIGN_LABEL = { right: 'Revisionist / Right', left: 'Labor / Left', religious: 'Religious Zionist', centrist: 'Centrist',
    institutional: 'Institutional', unaffiliated: 'No alignment data', unclassified: 'No alignment data' };
  var NET_KIND_LABEL = { actor: 'Actor', mk: 'Actor (Knesset Member)', org: 'Organisation', law: 'Law',
    topic: 'Topic', foreign: 'Foreign Patron' };
  var NET_KIND_RADIUS = { actor: 5.5, mk: 5.5, org: 6, law: 5, topic: 5, foreign: 5.5 };
  var NET_HIDDEN_KINDS = { law: true, topic: true };
  var NET_LAW_LIKE_TOPIC_TYPES = { "Legislative Proposal": 1, "UN Resolution": 1 };

  function netIdeologyMatch(list) {
    var text = (list || []).join(" | ").toLowerCase();
    if (NET_RELIGIOUS_KW.some(function(k){ return text.indexOf(k) !== -1; })) return "religious";
    if (NET_RIGHT_KW.some(function(k){ return text.indexOf(k) !== -1; })) return "right";
    if (NET_LEFT_KW.some(function(k){ return text.indexOf(k) !== -1; })) return "left";
    if (NET_CENTRIST_KW.some(function(k){ return text.indexOf(k) !== -1; })) return "centrist";
    return null;
  }

  function netBuildGraphData() {
    var orgById = {};
    ORGS.forEach(function(o) { orgById[o.org_id] = o; });

    // ---- org alignment: institutional type > ideology keywords > lineage propagation ----
    var orgAlign = {};
    ORGS.forEach(function(o) {
      orgAlign[o.org_id] = NET_INSTITUTIONAL_TYPES[o.org_type] ? "institutional" : netIdeologyMatch(o.ideology);
    });
    function lineageNeighbors(o) {
      var lin = o.lineage || {};
      var ids = (lin.predecessor_orgs || []).concat(lin.successor_orgs || []);
      if (lin.merged_into) ids.push(lin.merged_into);
      return ids.filter(function(i) { return orgById[i]; });
    }
    for (var pass = 0; pass < 4; pass++) {
      var changed = false;
      ORGS.forEach(function(o) {
        if (orgAlign[o.org_id] !== null) return;
        lineageNeighbors(o).some(function(nid) {
          if (orgAlign[nid] === "right" || orgAlign[nid] === "left" || orgAlign[nid] === "religious" || orgAlign[nid] === "centrist") {
            orgAlign[o.org_id] = orgAlign[nid]; changed = true; return true;
          }
          return false;
        });
      });
      if (!changed) break;
    }
    Object.keys(orgAlign).forEach(function(k) { if (orgAlign[k] === null) orgAlign[k] = "unaffiliated"; });

    // ---- nodes ----
    var nodes = [], nodeIndex = {};
    function addNode(id, kind, label, detail) { nodeIndex[id] = nodes.length; nodes.push({ id:id, kind:kind, label:label, detail:detail, align:null }); }

    ACTORS.forEach(function(a) {
      var life = a.life_span || {};
      addNode("actor:" + a.actor_id, "actor", a.full_name, {
        meta: (life.born||"?") + "–" + (life.died || "present"), role: a.historical_role || "",
        events: (a.key_land_actions||[]).map(function(e){ return { when:e.date||"", what:e.action_type||"", text:e.impact_description||"" }; }),
        personal: (a.personal_context||[]).map(function(p){ return { title:p.title||"", when:p.date_or_range||"", text:p.description||"" }; }),
      });
    });
    MKS.forEach(function(m) {
      var terms = m.knesset_terms || [];
      var parties = Array.from(new Set(terms.map(function(t){return t.party;}).filter(Boolean))).sort().join(", ") || "party affiliation not recorded";
      addNode("mk:" + m.mk_id, "mk", m.full_name, {
        meta: "Knesset Member · " + parties, role: "",
        events: (m.legislative_and_action_record||[]).map(function(e){ return { when:e.date||"", what:e.bill_or_action_title||"", text:((e.land_impact&&e.land_impact.description)||"") + " (" + (e.vote||"") + ")" }; }),
        personal: (m.personal_context||[]).map(function(p){ return { title:p.title||"", when:p.date_or_range||"", text:p.description||"" }; }),
      });
    });
    ORGS.forEach(function(o) {
      var dates = (o.founding_date||"?") + (o.dissolution_date ? (" – " + o.dissolution_date) : " – present");
      addNode("org:" + o.org_id, "org", o.name, {
        meta: (o.org_type||"") + " · " + dates, role: (o.ideology||[]).join(", "),
        events: (o.action_record||[]).map(function(e){ return { when:e.date||"", what:e.title||"", text:e.description||"" }; }),
        personal: [],
      });
      nodes[nodeIndex["org:" + o.org_id]].align = orgAlign[o.org_id];
    });
    LAWS.forEach(function(l) {
      addNode("law:" + l.law_id, "law", l.title, {
        meta: (l.category||"") + " · enacted " + (l.enactment_date||"?") + " (Knesset " + (l.knesset_number||"?") + ")", role: "",
        events: [{ when:l.enactment_date||"", what:"Summary", text:l.summary||"" }],
        personal: (l.land_impact && l.land_impact.description) ? [{ title:"Land impact", when:"", text:l.land_impact.description }] : [],
      });
    });
    TOPICS.forEach(function(t) {
      // Bills, motions and UN Resolutions are legislative texts in every sense that matters to a
      // reader, even though they live in topics.json (their schema -- date_or_range, summary,
      // significance -- fits the general-topic shape better than laws.json's enactment-date/
      // sponsoring-MK one, and most never passed so "enactment_date" wouldn't even apply). Nick
      // asked to fold them in with Laws rather than leave them looking like places or people --
      // done here at the display/graph-classification layer (kind -> "law") rather than a full
      // schema migration, so the entity itself still resolves and routes as a topic underneath.
      var kind = NET_LAW_LIKE_TOPIC_TYPES[t.topic_type] ? "law" : "topic";
      addNode("topic:" + t.topic_id, kind, t.name, {
        meta: (t.topic_type||"") + " · " + (t.date_or_range||""), role: "",
        events: [{ when:t.date_or_range||"", what:"Summary", text:t.summary||"" }],
        personal: t.significance ? [{ title:"Significance", when:"", text:t.significance }] : [],
      });
    });
    FOREIGN.forEach(function(f) {
      addNode("foreign:" + f.actor_id, "foreign", f.full_name, {
        meta: (f.organizational_role||"") + (f.organization ? (" · " + f.organization) : ""), role: f.public_registration || "",
        events: (f.action_record||[]).map(function(e){ return { when:e.date||"", what:e.action_type||"", text:e.description||"" }; }),
        personal: f.role_status ? [{ title:"Role status", when:"", text:f.role_status }] : [],
      });
      nodes[nodeIndex["foreign:" + f.actor_id]].align = "unaffiliated";
    });

    // ---- edges ----
    var edges = [], seen = {};
    function addEdge(a, b, kind) {
      if (nodeIndex[a] === undefined || nodeIndex[b] === undefined) return;
      var key = [a, b].sort().join("|") + "|" + kind;
      if (seen[key]) return;
      seen[key] = true;
      edges.push({ source:a, target:b, kind:kind });
    }
    ORGS.forEach(function(o) {
      var oid = "org:" + o.org_id;
      (o.notable_members||[]).forEach(function(mid) {
        if (nodeIndex["actor:" + mid] !== undefined) addEdge(oid, "actor:" + mid, "member");
        else if (nodeIndex["mk:" + mid] !== undefined) addEdge(oid, "mk:" + mid, "member");
      });
    });
    ORGS.forEach(function(o) {
      var oid = "org:" + o.org_id, lin = o.lineage || {};
      (lin.predecessor_orgs||[]).forEach(function(pid) { if (pid.indexOf(" ")===-1 && pid.indexOf("(")===-1) addEdge("org:"+pid, oid, "lineage"); });
      (lin.successor_orgs||[]).forEach(function(sid) { if (sid.indexOf(" ")===-1 && sid.indexOf("(")===-1) addEdge(oid, "org:"+sid, "lineage"); });
      if (lin.merged_into && lin.merged_into.indexOf(" ")===-1 && lin.merged_into.indexOf("(")===-1) addEdge(oid, "org:"+lin.merged_into, "lineage");
    });
    var NET_COMPONENT_OF = { "united-nations-general-assembly": "united-nations", "united-nations-security-council": "united-nations" };
    Object.keys(NET_COMPONENT_OF).forEach(function(child) { addEdge("org:" + NET_COMPONENT_OF[child], "org:" + child, "component"); });

    var peopleNames = MKS.map(function(m){ return ["mk:"+m.mk_id, m.full_name]; })
      .concat(ACTORS.map(function(a){ return ["actor:"+a.actor_id, a.full_name]; }));
    var GENERIC_ORG_IDS = { knesset:1, "state-of-israel":1 };
    LAWS.forEach(function(l) {
      var lid = "law:" + l.law_id;
      if (l.sponsoring_mk_id) addEdge(lid, "mk:" + l.sponsoring_mk_id, "sponsor");
      var text = l.summary || "";
      peopleNames.forEach(function(pn) { if (text.indexOf(pn[1]) !== -1) addEdge(lid, pn[0], "sponsor"); });
      ORGS.forEach(function(o) {
        var short = o.name.split("(")[0].trim();
        if (!GENERIC_ORG_IDS[o.org_id] && short.length > 4 && text.indexOf(short) !== -1) addEdge(lid, "org:" + o.org_id, "sponsor");
      });
    });
    TOPICS.forEach(function(t) {
      var tid = "topic:" + t.topic_id;
      (t.related_actor_ids||[]).forEach(function(aid) {
        addEdge(tid, "actor:" + aid, "context"); addEdge(tid, "mk:" + aid, "context"); addEdge(tid, "foreign:" + aid, "context");
      });
      (t.related_org_ids||[]).forEach(function(oid) { addEdge(tid, "org:" + oid, "context"); });
    });
    // topic <-> law, matched against each law's short title appearing in the topic's own
    // prose (e.g. Resolution 497's summary names "the Golan Heights Law" directly) -- topics
    // have no related_law_ids field to read structurally, so text matching is the only way
    // this connects at all, same extraction-not-invention discipline as law<->org above.
    TOPICS.forEach(function(t) {
      var tid = "topic:" + t.topic_id;
      var text = (t.summary || "") + " " + (t.significance || "");
      LAWS.forEach(function(l) {
        var short = l.title.split(",")[0].trim();
        if (short.length > 4 && text.indexOf(short) !== -1) addEdge(tid, "law:" + l.law_id, "context");
      });
    });
    FOREIGN.forEach(function(f) {
      var text = f.organization || "";
      ORGS.forEach(function(o) {
        var short = o.name.split("(")[0].trim();
        if (short.length > 4 && text.indexOf(short) !== -1) addEdge("foreign:" + f.actor_id, "org:" + o.org_id, "member");
      });
    });

    // ---- MK alignment: real per-term political_alignment first, org-propagation fallback ----
    MKS.forEach(function(m) {
      var terms = m.knesset_terms || [];
      if (terms.length) {
        var latest = terms[terms.length-1];
        if (NET_HAREDI_PARTIES[latest.party]) return; // let org-propagation resolve this one instead
        var mapped = NET_ALIGNMENT_FIELD_MAP[latest.political_alignment];
        if (mapped) nodes[nodeIndex["mk:" + m.mk_id]].align = mapped;
      }
    });
    var personOrgAligns = {};
    edges.forEach(function(e) {
      [[e.source,e.target],[e.target,e.source]].forEach(function(pair) {
        var a = pair[0], b = pair[1];
        if (a.indexOf("org:")===0 && (b.indexOf("actor:")===0 || b.indexOf("mk:")===0)) {
          (personOrgAligns[b] = personOrgAligns[b] || []).push(orgAlign[a.slice(4)] || "institutional");
        }
      });
    });
    Object.keys(personOrgAligns).forEach(function(nid) {
      if (nodes[nodeIndex[nid]].align === null) {
        var counts = {}; personOrgAligns[nid].forEach(function(v){ counts[v]=(counts[v]||0)+1; });
        var best=null,bestN=-1; Object.keys(counts).forEach(function(k){ if(counts[k]>bestN){best=k;bestN=counts[k];} });
        nodes[nodeIndex[nid]].align = best;
      }
    });
    nodes.forEach(function(n) { if ((n.kind==="actor"||n.kind==="mk") && n.align===null) n.align = "unaffiliated"; });

    function propagateFromEdges(kind, list, idField) {
      list.forEach(function(item) {
        var id = kind + ":" + item[idField];
        var aligns = [];
        edges.forEach(function(e) {
          var other = e.source===id ? e.target : (e.target===id ? e.source : null);
          if (other && nodes[nodeIndex[other]] && nodes[nodeIndex[other]].align) aligns.push(nodes[nodeIndex[other]].align);
        });
        var counts = {}; aligns.forEach(function(v){ counts[v]=(counts[v]||0)+1; });
        var best=null,bestN=-1; Object.keys(counts).forEach(function(k){ if(counts[k]>bestN){best=k;bestN=counts[k];} });
        nodes[nodeIndex[id]].align = best || "unclassified";
      });
    }
    propagateFromEdges("law", LAWS, "law_id");
    propagateFromEdges("topic", TOPICS, "topic_id");

    return { nodes: nodes, edges: edges };
  }

  // ---- force layout (hand-rolled, no library — same physics as the standalone prototype) ----
  var NET_W = 1260, NET_H = 1000;
  var netSvgNS = 'http://www.w3.org/2000/svg';

  function netInit() {
    if (NET.built) return;
    var data = netBuildGraphData();
    var nodes = data.nodes.map(function(n) {
      var col = ({ actor:0.22, mk:0.78, org:0.5, law:0.5, topic:0.5, foreign:0.9 }[n.kind]) || 0.5;
      var row = ({ actor:0.25, mk:0.25, org:0.55, law:0.8, topic:0.65, foreign:0.5 }[n.kind]) || 0.5;
      var jitter = 260;
      return { id:n.id, kind:n.kind, label:n.label, detail:n.detail, align:n.align||'unaffiliated',
        x: NET_W*col + (Math.random()-0.5)*jitter, y: NET_H*row + (Math.random()-0.5)*jitter,
        vx:0, vy:0, degree:0 };
    });
    var nodeById = {}; nodes.forEach(function(n){ nodeById[n.id]=n; });
    var edges = data.edges.map(function(e) {
      nodeById[e.source].degree++; nodeById[e.target].degree++;
      return { source:nodeById[e.source], target:nodeById[e.target], kind:e.kind };
    });
    var adjacency = {}; nodes.forEach(function(n){ adjacency[n.id]=[]; });
    edges.forEach(function(e){ adjacency[e.source.id].push(e.target.id); adjacency[e.target.id].push(e.source.id); });

    for (var it = 0; it < 340; it++) {
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i+1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy || 0.01, d = Math.sqrt(d2);
          var force = 3200 / d2, fx = (dx/d)*force, fy = (dy/d)*force;
          a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
        }
      }
      edges.forEach(function(e) {
        var dx = e.target.x-e.source.x, dy = e.target.y-e.source.y, d = Math.sqrt(dx*dx+dy*dy) || 0.01;
        var force = (d-46)*0.02, fx=(dx/d)*force, fy=(dy/d)*force;
        e.source.vx+=fx; e.source.vy+=fy; e.target.vx-=fx; e.target.vy-=fy;
      });
      var margin = 70;
      nodes.forEach(function(n) {
        n.vx += (NET_W/2-n.x)*0.0012; n.vy += (NET_H/2-n.y)*0.0012;
        if (n.x<margin) n.vx += (margin-n.x)*0.03;
        if (n.x>NET_W-margin) n.vx -= (n.x-(NET_W-margin))*0.03;
        if (n.y<margin) n.vy += (margin-n.y)*0.03;
        if (n.y>NET_H-margin) n.vy -= (n.y-(NET_H-margin))*0.03;
        n.vx += (Math.random()-0.5)*0.12; n.vy += (Math.random()-0.5)*0.12;
      });
      nodes.forEach(function(n) {
        n.vx*=0.82; n.vy*=0.82; n.x+=n.vx; n.y+=n.vy;
        n.x = Math.max(-150, Math.min(NET_W+150, n.x)); n.y = Math.max(-150, Math.min(NET_H+150, n.y));
      });
    }

    NET.nodes = nodes; NET.edges = edges; NET.nodeById = nodeById; NET.adjacency = adjacency;
    NET.viewBox = { x:0, y:0, w:NET_W, h:NET_H };
    NET.built = true;
  }

  function netBfsDistances(startId, maxDist) {
    var dist = {}; dist[startId] = 0;
    var queue = [startId], head = 0;
    while (head < queue.length) {
      var cur = queue[head++], d = dist[cur];
      if (d >= maxDist) continue;
      NET.adjacency[cur].forEach(function(nb) { if (!(nb in dist)) { dist[nb]=d+1; queue.push(nb); } });
    }
    return dist;
  }

  function netApplyViewBox() {
    // Reachable from a requestAnimationFrame loop (netAnimateViewBox's step()), which can still
    // have a frame in flight after the visitor has navigated off #/network and this svg no
    // longer exists -- guard rather than crash; the loop naturally stops scheduling more frames
    // once its own duration elapses.
    var svg = document.getElementById('netGraphSvg');
    if (!svg) return;
    svg.setAttribute('viewBox', NET.viewBox.x+' '+NET.viewBox.y+' '+NET.viewBox.w+' '+NET.viewBox.h);
  }

  function netMakeShape(kind, r) {
    var el;
    if (kind === 'actor' || kind === 'mk' || kind === 'foreign') {
      el = document.createElementNS(netSvgNS, 'circle'); el.setAttribute('r', r);
    } else if (kind === 'org') {
      el = document.createElementNS(netSvgNS, 'rect');
      el.setAttribute('x', -r*0.86); el.setAttribute('y', -r*0.86);
      el.setAttribute('width', r*1.72); el.setAttribute('height', r*1.72); el.setAttribute('rx', r*0.22);
      el.setAttribute('transform', 'rotate(45)');
    } else if (kind === 'law') {
      var s = r*1.9;
      el = document.createElementNS(netSvgNS, 'polygon');
      el.setAttribute('points', '0,'+(-s*0.62)+' '+(s*0.56)+','+(s*0.48)+' '+(-s*0.56)+','+(s*0.48));
      el.setAttribute('stroke-linejoin', 'round'); el.setAttribute('stroke-width', Math.max(2, r*0.4));
    } else {
      var pts = [];
      for (var i=0;i<6;i++) { var ang = Math.PI/3*i - Math.PI/6; pts.push((r*Math.cos(ang)).toFixed(2)+','+(r*Math.sin(ang)).toFixed(2)); }
      el = document.createElementNS(netSvgNS, 'polygon');
      el.setAttribute('points', pts.join(' ')); el.setAttribute('stroke-linejoin', 'round'); el.setAttribute('stroke-width', Math.max(2, r*0.4));
    }
    return el;
  }

  function netBaseLabelOk(n) {
    var r = NET_KIND_RADIUS[n.kind] + Math.min(n.degree, 8)*0.5;
    return r > 6.5 || n.degree > 3 || NET_HIDDEN_KINDS[n.kind];
  }

  function netHashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function netRenderGraph() {
    var svg = document.getElementById('netGraphSvg');
    svg.innerHTML = '';
    svg.insertAdjacentHTML('afterbegin', '<defs><filter id="netHalo" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5.5"/></filter></defs>');

    var edgeGroup = document.createElementNS(netSvgNS, 'g');
    edgeGroup.setAttribute('stroke', 'currentColor');
    NET.edges.forEach(function(e) {
      // A slight, deterministic bow on every edge (never a straight line) means a long edge
      // essentially never passes exactly through an unrelated third node's centre the way a
      // dense force-directed graph's dead-straight lines otherwise do -- purely a rendering
      // choice, the underlying source/target relationship is unchanged. Direction AND magnitude
      // both come from a hash of the edge's own node ids (not just direction, as a first pass
      // here got wrong) -- a busy hub like IDF has many short edges to closely-spaced neighbours,
      // and scaling bend off length alone left exactly that bundle almost dead-straight again,
      // the worst possible place for it. A varied magnitude fans a hub's short edges apart from
      // each other instead of leaving them re-bundled; still stable across re-renders, not random.
      var x1 = e.source.x, y1 = e.source.y, x2 = e.target.x, y2 = e.target.y;
      var dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy) || 1;
      var hv = netHashStr(e.source.id+'|'+e.target.id);
      var bend = Math.min(8 + (hv % 20), Math.max(len*0.4, 6));
      var sign = (hv % 2) ? 1 : -1;
      var nx = -dy/len, ny = dx/len;
      var mx = (x1+x2)/2 + nx*bend*sign, my = (y1+y2)/2 + ny*bend*sign;
      var line = document.createElementNS(netSvgNS, 'path');
      line.setAttribute('d', 'M'+x1+','+y1+' Q'+mx+','+my+' '+x2+','+y2);
      line.setAttribute('fill', 'none');
      line.setAttribute('class', 'net-edge');
      line.setAttribute('stroke-width', e.kind === 'lineage' ? '1.4' : '0.7');
      line.dataset.a = e.source.id; line.dataset.b = e.target.id;
      if (NET_HIDDEN_KINDS[e.source.kind] || NET_HIDDEN_KINDS[e.target.kind]) line.dataset.lawEdge = '1';
      edgeGroup.appendChild(line);
    });
    svg.appendChild(edgeGroup);

    var haloGroup = document.createElementNS(netSvgNS, 'g');
    var nodeGroup = document.createElementNS(netSvgNS, 'g');
    NET.nodes.forEach(function(n) {
      var color = NET_ALIGN_COLOR[n.align] || 'var(--fog)';
      var r = (NET_KIND_RADIUS[n.kind] || 5) + Math.min(n.degree, 8)*0.5;
      var noData = (n.align === 'unaffiliated' || n.align === 'unclassified');

      if (!NET_HIDDEN_KINDS[n.kind]) {
        var halo = netMakeShape(n.kind, r*2.1);
        halo.setAttribute('transform', 'translate('+n.x+','+n.y+')'+(n.kind==='org'?' rotate(45)':''));
        halo.setAttribute('fill', color); halo.setAttribute('opacity', '0.22'); halo.setAttribute('filter', 'url(#netHalo)');
        haloGroup.appendChild(halo);
      }
      var g = document.createElementNS(netSvgNS, 'g');
      g.setAttribute('transform', 'translate('+n.x+','+n.y+')');
      g.style.cursor = 'pointer'; g.dataset.id = n.id; g.dataset.kind = n.kind;

      var shape = netMakeShape(n.kind, r);
      shape.setAttribute('fill', color); shape.setAttribute('fill-opacity', noData ? '0.5' : '0.92');
      if (n.kind === 'law' || n.kind === 'topic') shape.setAttribute('stroke', color);
      if (noData) { shape.setAttribute('stroke', color); shape.setAttribute('stroke-width', '1.1'); shape.setAttribute('fill', 'var(--panel-bg)'); }
      g.appendChild(shape);

      var text = document.createElementNS(netSvgNS, 'text');
      text.setAttribute('x', r+5); text.setAttribute('y', 3.2); text.setAttribute('font-size', '8.2');
      text.setAttribute('font-family', 'Public Sans, sans-serif'); text.setAttribute('fill', 'currentColor');
      text.textContent = n.label; text.style.display = netBaseLabelOk(n) ? '' : 'none';
      g.appendChild(text);

      g.addEventListener('click', function() { netSelectNode(n.id); });
      nodeGroup.appendChild(g);
    });
    svg.appendChild(haloGroup); svg.appendChild(nodeGroup);
    netApplyVisibility();
  }

  var NET_OPACITY_BY_TIER = [1, 0.8, 0.32];
  var NET_EDGE_OPACITY_BY_TIER = [0.85, 0.5, 0.14];

  function netApplyVisibility() {
    var svg = document.getElementById('netGraphSvg');
    var dist = NET.selectedId ? netBfsDistances(NET.selectedId, 2) : null;
    svg.querySelectorAll('g[data-id]').forEach(function(g) {
      var id = g.dataset.id, kind = g.dataset.kind, n = NET.nodeById[id];
      var isHidden = !!NET_HIDDEN_KINDS[kind];
      // Once a selection is active, Laws/Topics follow the same 2-hop tier rules as everyone
      // else (two topics that both cite the Knesset should surface at 2 hops from each other,
      // not just the one directly clicked) -- the "only on zoom" cap is the no-selection
      // default only, not a restriction that survives into an active selection.
      var maxTier = dist ? 2 : ((isHidden && !NET.showHidden) ? 1 : 2);
      var exists, tier;
      if (dist) { var d = dist[id]; exists = (d !== undefined && d <= maxTier); tier = exists ? Math.min(d,2) : 0; }
      else { exists = !isHidden || NET.showHidden; tier = 0; }
      g.style.display = exists ? '' : 'none';
      if (!exists) return;
      g.style.opacity = NET_OPACITY_BY_TIER[tier];
      var label = g.querySelector('text');
      if (label) label.style.display = (dist ? (tier<=1 || netBaseLabelOk(n)) : netBaseLabelOk(n)) ? '' : 'none';
    });
    svg.querySelectorAll('.net-edge').forEach(function(l) {
      var isHiddenEdge = !!l.dataset.lawEdge;
      if (!dist) { l.style.display = (!isHiddenEdge || NET.showHidden) ? '' : 'none'; l.style.opacity = ''; return; }
      var maxA = 2, maxB = 2; // same relaxation as the node loop above -- see comment there
      var da = dist[l.dataset.a], db = dist[l.dataset.b];
      var visible = da !== undefined && da <= maxA && db !== undefined && db <= maxB;
      l.style.display = visible ? '' : 'none';
      if (visible) l.style.opacity = NET_EDGE_OPACITY_BY_TIER[Math.max(Math.min(da,2), Math.min(db,2))];
    });
  }

  function netToggleShowHidden() {
    NET.showHidden = !NET.showHidden;
    document.getElementById('netShowHiddenBtn').classList.toggle('active', NET.showHidden);
    netApplyVisibility();
  }

  function netBoundsFor(ids) {
    var xs=[], ys=[];
    ids.forEach(function(id){ var n=NET.nodeById[id]; if(n){ xs.push(n.x); ys.push(n.y); } });
    if (!xs.length) return { x:0, y:0, w:NET_W, h:NET_H };
    var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs), minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
    var pad = ids.length<=2 ? 130 : 80;
    var bw=Math.max(maxX-minX+pad*2,160), bh=Math.max(maxY-minY+pad*2,160);
    var aspect = NET_W/NET_H;
    if (bw/bh > aspect) bh = bw/aspect; else bw = bh*aspect;
    var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
    return { x:cx-bw/2, y:cy-bh/2, w:bw, h:bh };
  }

  function netAnimateViewBox(target, duration) {
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { NET.viewBox = target; netApplyViewBox(); return; }
    var myToken = ++NET.animToken;
    var start = { x:NET.viewBox.x, y:NET.viewBox.y, w:NET.viewBox.w, h:NET.viewBox.h };
    var t0 = null;
    function step(ts) {
      if (myToken !== NET.animToken) return;
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts-t0)/duration), ease = 1-Math.pow(1-p,3);
      NET.viewBox = { x:start.x+(target.x-start.x)*ease, y:start.y+(target.y-start.y)*ease,
        w:start.w+(target.w-start.w)*ease, h:start.h+(target.h-start.h)*ease };
      netApplyViewBox();
      if (p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function netZoomBy(factor) {
    var cx = NET.viewBox.x+NET.viewBox.w/2, cy = NET.viewBox.y+NET.viewBox.h/2;
    var w = Math.max(90, Math.min(NET_W*1.4, NET.viewBox.w/factor)), h = w*(NET_H/NET_W);
    netAnimateViewBox({ x:cx-w/2, y:cy-h/2, w:w, h:h }, 220);
  }
  function netResetView() { netAnimateViewBox({ x:0, y:0, w:NET_W, h:NET_H }, 550); }

  function netSelectNode(id) {
    NET.selectedId = id;
    var n = NET.nodeById[id];
    if (!n) return;
    netApplyVisibility();
    var dist = netBfsDistances(id, 1);
    netAnimateViewBox(netBoundsFor(Object.keys(dist)), 650);

    var d = n.detail;
    var badgeColor = NET_ALIGN_COLOR[n.align] || 'var(--fog)';
    var html = '<button class="net-info-close" onclick="netClearSelection()">Close ✕</button>';
    html += '<span class="net-info-badge" style="border-color:'+badgeColor+'; color:'+badgeColor+'">'+NET_KIND_LABEL[n.kind]+' · '+NET_ALIGN_LABEL[n.align]+'</span>';
    html += '<h3>'+n.label+'</h3>';
    html += '<div class="net-info-meta">'+(d.meta||'')+'</div>';
    if (d.role) html += '<div class="net-info-role">'+autolink(d.role, n.id, true)+'</div>';
    if (d.events && d.events.length) {
      html += '<div class="net-info-section-h">Record</div>';
      d.events.slice(0,6).forEach(function(ev) {
        if (!ev.text) return;
        html += '<div class="net-info-event"><div class="when">'+(ev.when||'')+'</div><div class="what">'+(ev.what||'')+'</div><p>'+autolink(ev.text, n.id, true)+'</p></div>';
      });
    }
    if (d.personal && d.personal.length) {
      html += '<div class="net-info-section-h">Beyond the ledger</div>';
      d.personal.slice(0,3).forEach(function(p) {
        html += '<div class="net-info-event"><div class="when">'+(p.when||'')+'</div><div class="what">'+(p.title||'')+'</div><p>'+autolink(p.text, n.id, true)+'</p></div>';
      });
    }
    document.getElementById('netInfoPanel').innerHTML = html;
    // Mobile-only sizing hook (see @media max-width:860px): the info panel stays short while
    // empty and grows once there's a real record to read.
    var wrap = document.getElementById('netInfoPanelWrap');
    if (wrap) wrap.classList.add('has-selection');
  }

  function netClearSelection() {
    NET.selectedId = null;
    netApplyVisibility();
    document.getElementById('netInfoPanel').innerHTML = '<div class="net-info-empty"><span class="big">◈</span>Click any node to open its record here.<br>Drag the canvas to pan, scroll to zoom.</div>';
    var wrap = document.getElementById('netInfoPanelWrap');
    if (wrap) wrap.classList.remove('has-selection');
    netResetView();
  }

  // Jump straight to a node's record -- used by the network view's own inline search. Used to
  // flip a CSS 3D card from an index face to the graph face first; the graph is the only face
  // now, so this just selects.
  function netJumpToNode(id) {
    netSelectNode(id);
  }

  function netOnSearchInput() {
    var q = document.getElementById('netSearchBox').value.trim().toLowerCase();
    var box = document.getElementById('netSearchResults');
    if (!q) { box.hidden = true; box.innerHTML = ''; return; }
    var matches = NET.nodes.filter(function(n) { return n.label.toLowerCase().indexOf(q) !== -1; }).slice(0, 12);
    box.innerHTML = matches.length ? matches.map(function(n) {
      return '<div class="net-sr-item" onclick="netSearchJump(\''+n.id.replace(/'/g,"\\'")+'\')">'+
        '<span class="net-sr-kind">'+(NET_KIND_LABEL[n.kind]||n.kind)+'</span><span>'+n.label+'</span></div>';
    }).join('') : '<div class="net-sr-empty">No matches</div>';
    box.hidden = false;
  }
  function netOnSearchKeydown(e) {
    if (e.key === 'Escape') { document.getElementById('netSearchResults').hidden = true; document.getElementById('netSearchBox').blur(); }
    if (e.key === 'Enter') { var first = document.querySelector('#netSearchResults .net-sr-item'); if (first) first.click(); }
  }
  function netSearchJump(id) {
    document.getElementById('netSearchBox').value = '';
    document.getElementById('netSearchResults').hidden = true;
    netJumpToNode(id);
  }

  // Every one of these is invoked from an inline onclick/oninput/onkeydown attribute inside
  // innerHTML-injected markup (the toolbar buttons, the close button, the search box). Inline
  // event-attribute handlers run in global scope, not this IIFE's closure, so without this each
  // one throws "X is not defined" on the very first click and silently does nothing -- which is
  // exactly what happened to the close button (and, before it was removed, the old flip button).
  // Aliasing to window rather than declaring these as window.* directly so every internal bare
  // call (netResetView() inside netClearSelection, etc.) keeps resolving through the closure.
  window.netClearSelection = netClearSelection;
  window.netOnSearchInput = netOnSearchInput;
  window.netOnSearchKeydown = netOnSearchKeydown;
  window.netResetView = netResetView;
  window.netSearchJump = netSearchJump;
  window.netToggleShowHidden = netToggleShowHidden;
  window.netZoomBy = netZoomBy;

  document.addEventListener('click', function(e) {
    var box = document.getElementById('netSearchResults');
    if (box && !box.hidden && e.target.closest && !e.target.closest('.net-panel-search')) box.hidden = true;
  });

  // pan by drag; a near-zero-movement pointerup on empty canvas deselects
  var netDragging = false, netDragStart = null, netVbStart = null, netMoved = 0;
  function netWireGraphEvents() {
    var svg = document.getElementById('netGraphSvg');
    if (svg.dataset.wired) return;
    svg.dataset.wired = '1';
    svg.addEventListener('pointerdown', function(e) {
      if (e.target.closest('g[data-id]')) return;
      netDragging = true; netMoved = 0;
      netDragStart = { x:e.clientX, y:e.clientY }; netVbStart = { x:NET.viewBox.x, y:NET.viewBox.y };
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', function(e) {
      if (!netDragging) return;
      var rect = svg.getBoundingClientRect(), scale = NET.viewBox.w/rect.width;
      var dx = e.clientX-netDragStart.x, dy = e.clientY-netDragStart.y;
      netMoved = Math.max(netMoved, Math.abs(dx)+Math.abs(dy));
      NET.viewBox.x = netVbStart.x - dx*scale; NET.viewBox.y = netVbStart.y - dy*scale;
      netApplyViewBox();
    });
    svg.addEventListener('pointerup', function(e) {
      if (netDragging && netMoved < 4 && !e.target.closest('g[data-id]') && NET.selectedId) netClearSelection();
      netDragging = false;
    });
    svg.addEventListener('wheel', function(e) { e.preventDefault(); netZoomBy(e.deltaY < 0 ? 1.12 : 0.89); }, { passive: false });
  }

  function showNetwork() {
    netInit();
    netApplyViewBox();
    netRenderGraph();
    netWireGraphEvents();
  }

  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    var app = document.getElementById("app");
    var foot = document.getElementById("footnote");
    window.scrollTo(0, 0);

    if (parts.length === 0) {
      // Network is the front door; the card-index lives at #/index for readers who want the
      // traditional list view instead.
      app.innerHTML = renderNetwork();
      foot.textContent = "";
      showNetwork();
      maybeShowNetworkIntro();
      return;
    }
    if (parts[0] === "index") {
      app.innerHTML = renderIndex();
      foot.textContent = "";
      return;
    }
    if (parts[0] === "search") {
      app.innerHTML = renderSearch(decodeURIComponent(parts[1] || ""));
      foot.textContent = "";
      return;
    }
    if (parts[0] === "about") {
      app.innerHTML = renderAbout();
      foot.textContent = "";
      return;
    }
    if (parts[0] === "network") {
      app.innerHTML = renderNetwork();
      foot.textContent = "";
      showNetwork(); // builds the graph lazily on first visit, then renders + wires interaction
      // #/network/<kind>/<id> (what the Index page's own links now point at, so following one
      // there lands inside the graph, selected, rather than on that entity's separate full page)
      // selects the node once the graph exists to select it in.
      if (parts[1] && parts[2]) netSelectNode(parts[1] + ":" + parts[2]);
      maybeShowNetworkIntro();
      return;
    }
    var key = parts[0] + ":" + parts[1];
    var e = entities[key];
    if (!e) {
      app.innerHTML = '<p class="not-found">Nothing here yet. <a href="#/">Back to index</a></p>';
      foot.textContent = "";
      return;
    }
    if (e.kind === "actor") app.innerHTML = renderActor(e.data);
    else if (e.kind === "org") app.innerHTML = renderOrg(e.data);
    else if (e.kind === "mk") app.innerHTML = renderMK(e.data);
    else if (e.kind === "law") app.innerHTML = renderLaw(e.data);
    else if (e.kind === "topic") app.innerHTML = renderTopic(e.data);
    else if (e.kind === "foreign") app.innerHTML = renderForeign(e.data);
    else app.innerHTML = '<p class="not-found">This entry doesn\'t have its own page yet. <a href="#/">Back to index</a></p>';

    foot.textContent = "Growing archive — " + ACTORS.length + " people, " + ORGS.length +
      " organisations, " + LAWS.length + " laws, and " + TOPICS.length + " places, periods, and events documented so far.";
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
