      var short = e.name.split(",")[0].trim();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var linkPattern = null;
  function buildPattern() {
    if (linkPattern) return linkPattern;
    var alt = nameIndex.map(function (n) { return escapeRegex(n.name); }).join("|");
    // word boundaries matter here — without them "Peel" would match inside "appeal"/"repeal"
    linkPattern = new RegExp("\\b(" + alt + ")\\b", "g");
    return linkPattern;
  }
  var nameToKey = {};
  nameIndex.forEach(function (n) { if (!nameToKey[n.name]) nameToKey[n.name] = n.key; });

  // Auto-link known entity names inside free text. Skips linking the entity's own page to itself.
  function autolink(text, selfKey) {
    if (!text) return "";
    var pattern = buildPattern();
    var escaped = escapeHtml(text);
    return escaped.replace(pattern, function (match) {
      var key = nameToKey[match];
      if (!key || key === selfKey) return match;
      return '<a href="#/' + key.replace(":", "/") + '">' + match + "</a>";
    });
  }

  function linkIfKnownOrg(text) {
    // best-effort match of a free-text affiliation string against a known org name
    for (var i = 0; i < ORGS.length; i++) {
      if (text.indexOf(ORGS[i].name) !== -1) {
        return '<a href="#/org/' + ORGS[i].org_id + '">' + escapeHtml(text) + "</a>";
      }
    }
    return escapeHtml(text);
  }

  // ---- renderers ----
  function renderActor(a) {
    var lifespan = a.life_span ? (a.life_span.born || "?") + " – " + (a.life_span.died || "living") : "";
    var html = '<span class="badge">Historical Actor</span>';
    html += '<div class="infobox"><dt>Born</dt><dd>' + escapeHtml(a.birth_country || "—") + "</dd>";
    html += "<dt>Life span</dt><dd>" + escapeHtml(lifespan) + "</dd>";
    if (a.birth_name && a.birth_name !== a.full_name) html += "<dt>Birth name</dt><dd>" + escapeHtml(a.birth_name) + "</dd>";
    html += "<dt>Affiliations</dt><dd>" + (a.primary_affiliations || []).map(linkIfKnownOrg).join("<br>") + "</dd></div>";
    html += '<h1 class="entity-title">' + escapeHtml(a.full_name) + "</h1>";
    html += '<section class="body"><p>' + autolink(a.historical_role, "actor:" + a.actor_id) + "</p></section>";
    if (a.key_land_actions && a.key_land_actions.length) {
      html += '<h2 class="section-head">Key actions</h2>';
      a.key_land_actions.forEach(function (k) {
        html += '<div class="event"><div class="when">' + escapeHtml(k.date) + " · " + escapeHtml(k.action_type) +
          " · " + escapeHtml(k.location_affected) + '</div><p>' + autolink(k.impact_description, "actor:" + a.actor_id) + "</p>" +
          '<div class="cite">' + escapeHtml(k.primary_source_citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function renderOrg(o) {
    var html = '<span class="badge">' + escapeHtml(o.org_type || "Organization") + "</span>";
    html += '<div class="infobox"><dt>Founded</dt><dd>' + escapeHtml(o.founding_date || "—") + "</dd>";
    if (o.dissolution_date) html += "<dt>Dissolved</dt><dd>" + escapeHtml(o.dissolution_date) + "</dd>";
    html += "<dt>Ideology</dt><dd>" + (o.ideology || []).join(", ") + "</dd>";
    var pred = (o.lineage && o.lineage.predecessor_orgs || []).map(function (p) { return orgLink(p); }).join(", ");
    var succ = (o.lineage && o.lineage.successor_orgs || []).map(function (p) { return orgLink(p); }).join(", ");
    if (pred) html += "<dt>Preceded by</dt><dd>" + pred + "</dd>";
    if (succ) html += "<dt>Followed by</dt><dd>" + succ + "</dd>";
    var members = (o.notable_members || []).map(function (m) { return actorLink(m); }).join("<br>");
    if (members) html += "<dt>Notable members</dt><dd>" + members + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(o.name) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(o.hebrew_name || "") + "</p>";
    if (o.action_record && o.action_record.length) {
      html += '<h2 class="section-head">Timeline</h2>';
      o.action_record.forEach(function (e) {
        html += '<div class="event"><div class="when">' + escapeHtml(e.date) + " · " + escapeHtml(e.action_type) + '</div><div class="what">' +
          escapeHtml(e.title) + '</div><p>' + autolink(e.description, "org:" + o.org_id) + "</p>" +
          '<div class="cite">' + escapeHtml(e.citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function orgLink(idOrText) {
    var org = ORGS.find(function (o) { return o.org_id === idOrText; });
    if (org) return '<a href="#/org/' + org.org_id + '">' + escapeHtml(org.name) + "</a>";
    return escapeHtml(idOrText);
  }
  function personLink(id) {
    // people can live in either historical_actors.json ("actor") or knesset_members.json
    // ("mk") — check both rather than assuming, so MK references (e.g. a law's sponsoring
    // minister) resolve correctly instead of always falling through to "not yet profiled".
    var e = entities["actor:" + id] || entities["mk:" + id];
    var kind = entities["actor:" + id] ? "actor" : "mk";
    if (e) return '<a href="#/' + kind + '/' + id + '">' + escapeHtml(e.name) + "</a>";
    return escapeHtml(id) + " <span style='color:var(--fog)'>(not yet profiled)</span>";
  }
  var actorLink = personLink; // legacy name, kept as an alias

  function lawLink(id) {
    var l = entities["law:" + id];
    if (l) return '<a href="#/law/' + id + '">' + escapeHtml(l.name) + "</a>";
    return escapeHtml(id) + " <span style='color:var(--fog)'>(not yet profiled)</span>";
  }

  function renderMK(m) {
    var html = '<span class="badge">Knesset Member</span>';
    html += '<div class="infobox">';
    if (m.birth_country) html += "<dt>Born</dt><dd>" + escapeHtml(m.birth_country) + "</dd>";
    if (m.birth_name && m.birth_name !== m.full_name) html += "<dt>Birth name</dt><dd>" + escapeHtml(m.birth_name) + "</dd>";
    var terms = (m.knesset_terms || []).map(function (t) {
      return "Knesset " + t.knesset_number + " — " + linkIfKnownOrg(t.party) + " (" + escapeHtml(t.political_alignment) + ")";
    }).join("<br>");
    if (terms) html += "<dt>Knesset terms</dt><dd>" + terms + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(m.full_name) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(m.hebrew_name || "") + "</p>";
    if (m.legislative_and_action_record && m.legislative_and_action_record.length) {
      html += '<h2 class="section-head">Legislative record</h2>';
      m.legislative_and_action_record.forEach(function (r) {
        html += '<div class="event"><div class="when">' + escapeHtml(r.date) + " · " + escapeHtml(r.category) + '</div><div class="what">' +
          autolink(r.bill_or_action_title, "mk:" + m.mk_id) + " — " + escapeHtml(r.vote) + "</div>";
        if (r.land_impact && r.land_impact.description) {
          html += "<p>" + autolink(r.land_impact.description, "mk:" + m.mk_id) + "</p>";
        }
        html += '<div class="cite">' + escapeHtml(r.citation || "") + "</div></div>";
      });
    }
    return html;
  }

  function renderLaw(l) {
    var html = '<span class="badge">' + escapeHtml(l.category || "Law") + "</span>";
    html += '<div class="infobox">';
    html += "<dt>Enacted</dt><dd>" + escapeHtml(l.enactment_date || "—") + (l.knesset_number ? " · Knesset " + l.knesset_number : "") + "</dd>";
    if (l.sponsoring_ministry) html += "<dt>Sponsoring ministry</dt><dd>" + escapeHtml(l.sponsoring_ministry) + "</dd>";
    if (l.sponsoring_mk_id) html += "<dt>Sponsoring minister</dt><dd>" + personLink(l.sponsoring_mk_id) + "</dd>";
    if (l.official_citation) html += "<dt>Official citation</dt><dd>" + escapeHtml(l.official_citation) + "</dd>";
    html += "</div>";
    html += '<h1 class="entity-title">' + escapeHtml(l.title) + "</h1>";
    html += '<p class="subtitle">' + escapeHtml(l.hebrew_title || "") + "</p>";
    html += '<section class="body"><p>' + autolink(l.summary, "law:" + l.law_id) + "</p></section>";
    if (l.land_impact) {
      html += '<h2 class="section-head">Land impact</h2>';
      html += '<div class="event">';
      if (l.land_impact.spatial_region) html += '<div class="when">' + escapeHtml(l.land_impact.spatial_region) + "</div>";
      if (l.land_impact.estimated_hectares_affected != null) {
        html += "<p><b>" + escapeHtml(String(l.land_impact.estimated_hectares_affected)) + "</b> hectares (estimated)</p>";
      }
      html += "<p>" + autolink(l.land_impact.description, "law:" + l.law_id) + "</p>";
      html += "</div>";
    }
    html += '<div class="cite" style="margin-top:1rem">' + escapeHtml(l.citation || "") + "</div>";
    return html;
  }

  function renderTopic(t) {
    var html = '<span class="badge">' + escapeHtml(t.topic_type || "Topic") + "</span>";
    var related = (t.related_actor_ids || []).map(personLink).concat((t.related_org_ids || []).map(orgLink));
    if (t.date_or_range || related.length) {
      html += '<div class="infobox">';
      if (t.date_or_range) html += "<dt>Date</dt><dd>" + escapeHtml(t.date_or_range) + "</dd>";
      if (related.length) html += "<dt>Related</dt><dd>" + related.join("<br>") + "</dd>";
      html += "</div>";
    }
    html += '<h1 class="entity-title">' + escapeHtml(t.name) + "</h1>";
    if (t.hebrew_name) html += '<p class="subtitle">' + escapeHtml(t.hebrew_name) + "</p>";
    if (t.aliases && t.aliases.length) html += '<p class="subtitle">Also known as: ' + t.aliases.map(escapeHtml).join(", ") + "</p>";
    html += '<section class="body"><p>' + autolink(t.summary, "topic:" + t.topic_id) + "</p></section>";
    if (t.significance) {
      html += '<h2 class="section-head">Why it matters here</h2>';
      html += "<p>" + autolink(t.significance, "topic:" + t.topic_id) + "</p>";
    }
    html += '<div class="cite" style="margin-top:1rem">' + escapeHtml(t.citation || "") + "</div>";
    return html;
  }

  function renderAbout() {
    var html = '<h1 class="entity-title">About this record</h1>';
    html += '<section class="body">';
    html += "<p>I'm trying to put together a properly cited record of land loss and dispossession in " +
      "Palestine and Israel, from Ottoman-era Palestine right through to now. Every person, organization, " +
      "law and vote gets its own page, and they're all linked to each other so you can follow a thread " +
      "wherever it actually leads. Alongside that there's a newer piece I've been building: a ledger of " +
      "modern Knesset legislation and how individual Members of Knesset actually voted on land, settlement, " +
      "demographic, and punitive-law questions.</p>";

    html += '<h2 class="section-head">How a citation works</h2>';
    html += "<p>Every claim on here carries its own citation, and I've tried to be honest about how sure I " +
      "actually am of each one rather than presenting everything as equally certain.</p>";
    html += "<p><strong>VERIFIED [date]</strong> means I checked it against a named source, a primary " +
      "document, a peer-reviewed or major press source, or, for the Knesset voting ledger, this project's " +
      "own completed pull of the Knesset's official public vote-records API, checked against outside " +
      "reporting wherever that exists.</p>";
    html += "<p><strong>UNVERIFIED, best guess</strong> means it's a plausible detail I haven't independently " +
      "checked yet. I've left those visible rather than quietly smoothing them away, because early on I " +
      "found a plausible-looking guess can just be wrong. The Land Acquisition Law and Absentees' Property " +
      "Law entries both had an incorrect citation that only got caught and fixed this same way.</p>";
    html += "<p>Where a figure is genuinely disputed in the historical record, a casualty count or a " +
      "population estimate, I've said so and given the real range rather than forcing a single number that " +
      "looks more precise than it actually is.</p>";

    html += '<h2 class="section-head">Where the material comes from</h2>';
    html += "<p>Anything before 1948 is built from established scholarship and primary documents where I " +
      "could find them. There's no open, machine-readable archive yet of the Yishuv's own institutions from " +
      "that era (the Asefat HaNivcharim and Va'ad Leumi), so that whole period is narrative and " +
      "citation-checked rather than built off a bulk data source.</p>";
    html += "<p>The modern Knesset ledger, 2003 onward, is different. That's built from my own complete pull " +
      "of the Knesset's own public API, something like two million individual vote-result rows, filtered " +
      "down by keyword search and then reviewed and promoted into real entries one vote at a time rather " +
      "than dumped in wholesale. Where I can, I've confirmed a bill's actual sponsor directly against the " +
      "Knesset's own records rather than relying on press coverage alone. Pre-2003 votes aren't available " +
      "this way (the Knesset's own records don't go back further), so early Knesset entries are also " +
      "narrative, sourced from named ministerial sponsorship rather than an individual floor vote.</p>";

    html += '<h2 class="section-head">On people still in public life</h2>';
    html += "<p>For anyone still in public life, I've stuck to documented governmental and legislative " +
      "conduct, a real vote, a real ministerial decision, each with its own citation, and stayed away from " +
      "personal characterization. The pattern across more than a century isn't really in question and I " +
      "haven't tried to hedge it, but any specific claim about a specific living person is held to exactly " +
      "the same standard as everyone else here.</p>";

    html += '<h2 class="section-head">What this isn\'t</h2>';
    html += "<p>This isn't finished, and it isn't trying to be exhaustive. The count at the bottom of every " +
      "page is literal, not decoration, it just means what's been researched and added so far. If someone " +
      "or something isn't here yet, it's because I haven't got to it, not because I looked at it and left " +
      "it out.</p>";
    html += "</section>";
    return html;
  }

  function renderIndex() {
    var html = '<div class="home-hero"><span class="kicker">A working record, not a finished one</span>';
    html += "<h1>Every actor, every party, one click apart</h1>";
    html += "<p>Start anywhere, a person's page links to the organizations they built or joined, and back to everyone else who passed through them. Nothing here is re-typed by hand, every page is generated straight from the underlying research. <a href=\"#/about\">How this is built and cited &rarr;</a></p></div>";

    // Every index list is alphabetized — browsing by eye (not just searching) is a real way
    // readers find a page, and the order entries happened to be added in isn't a useful sort.
    function byName(key) { return function (x, y) { return x[key].localeCompare(y[key]); }; }
    var actorsSorted = ACTORS.slice().sort(byName("full_name"));
    var orgsSorted = ORGS.slice().sort(byName("name"));
    var mksSorted = MKS.slice().sort(byName("full_name"));
    var lawsSorted = LAWS.slice().sort(byName("title"));
    var topicsSorted = TOPICS.slice().sort(byName("name"));

    html += '<div class="index-group"><h2>Historical Actors (' + ACTORS.length + ")</h2><div class=\"index-grid\">";
    actorsSorted.forEach(function (a) { html += '<a href="#/actor/' + a.actor_id + '">' + escapeHtml(a.full_name) + "</a>"; });
    html += "</div></div>";

    html += '<div class="index-group"><h2>Organizations (' + ORGS.length + ")</h2><div class=\"index-grid\">";
    orgsSorted.forEach(function (o) { html += '<a href="#/org/' + o.org_id + '">' + escapeHtml(o.name) + "</a>"; });
    html += "</div></div>";

    if (MKS.length) {
      html += '<div class="index-group"><h2>Knesset Members (' + MKS.length + ")</h2><div class=\"index-grid\">";
      mksSorted.forEach(function (m) { html += '<a href="#/mk/' + m.mk_id + '">' + escapeHtml(m.full_name) + "</a>"; });
      html += "</div></div>";
    }

    if (LAWS.length) {
      html += '<div class="index-group"><h2>Laws (' + LAWS.length + ")</h2><div class=\"index-grid\">";
      lawsSorted.forEach(function (l) { html += '<a href="#/law/' + l.law_id + '">' + escapeHtml(l.title.split(",")[0]) + "</a>"; });
      html += "</div></div>";
    }

    if (TOPICS.length) {
      html += '<div class="index-group"><h2>Places, Periods &amp; Events (' + TOPICS.length + ")</h2><div class=\"index-grid\">";
      topicsSorted.forEach(function (t) { html += '<a href="#/topic/' + t.topic_id + '">' + escapeHtml(t.name) + "</a>"; });
      html += "</div></div>";
    }

    return html;
  }

  function renderSearch(q) {
    q = q.toLowerCase();
    // Rank 0: title match. Rank 1: alias match. Rank 2: only a mention somewhere in the
    // entity's own body text (a summary/description that happens to name the search term).
    // The filter itself runs against the full searchBlob, so a mention anywhere is a hit —
    // the rank just controls display order so title/alias matches surface first.
    function rank(e) {
      if (e.name.toLowerCase().indexOf(q) !== -1) return 0;
      if (e.data.aliases && e.data.aliases.some(function (al) { return al.toLowerCase().indexOf(q) !== -1; })) return 1;
      return 2;
    }
    var hits = Object.keys(entities)
      .filter(function (k) { return entities[k].searchBlob.indexOf(q) !== -1; })
      .map(function (k) { return { key: k, rank: rank(entities[k]) }; })
      .sort(function (a, b) { return a.rank - b.rank || entities[a.key].name.localeCompare(entities[b.key].name); });
    var html = '<h1 class="entity-title">Search: "' + escapeHtml(q) + '"</h1>';
    if (!hits.length) { html += '<p class="not-found">No matches.</p>'; return html; }
    html += '<div class="index-grid">';
    hits.forEach(function (hit) {
      var e = entities[hit.key];
      var tag = hit.rank === 2 ? "mentioned" : e.kind;
      html += '<a href="#/' + hit.key.replace(":", "/") + '">' + escapeHtml(e.name) + " <span style='color:var(--fog);font-size:0.75em'>(" + tag + ")</span></a>";
    });
    html += "</div>";
    return html;
  }

  window.doSearch = function (evt) {
    evt.preventDefault();
    var v = document.getElementById("searchbox").value.trim();
    if (v) location.hash = "#/search/" + encodeURIComponent(v);
    return false;
  };

  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    var app = document.getElementById("app");
    var foot = document.getElementById("footnote");
    window.scrollTo(0, 0);

    if (parts.length === 0) {
      app.innerHTML = renderIndex();
      foot.textContent = "";
      return;
    }
    if (parts[0] === "search") {
      app.innerHTML = renderSearch(decodeURIComponent(parts[1] || ""));
      foot.textContent = "";
      return;
    }
    if (parts[0] === "about") {
      app.innerHTML = renderAbout();
      foot.textContent = "";
      return;
    }
    var key = parts[0] + ":" + parts[1];
    var e = entities[key];
    if (!e) {
      app.innerHTML = '<p class="not-found">Nothing here yet. <a href="#/">Back to index</a></p>';
      foot.textContent = "";
      return;
    }
    if (e.kind === "actor") app.innerHTML = renderActor(e.data);
    else if (e.kind === "org") app.innerHTML = renderOrg(e.data);
    else if (e.kind === "mk") app.innerHTML = renderMK(e.data);
    else if (e.kind === "law") app.innerHTML = renderLaw(e.data);
    else if (e.kind === "topic") app.innerHTML = renderTopic(e.data);
    else app.innerHTML = '<p class="not-found">This entry doesn\'t have its own page yet. <a href="#/">Back to index</a></p>';

    foot.textContent = "Growing archive — " + ACTORS.length + " people, " + ORGS.length +
      " organizations, " + LAWS.length + " laws, and " + TOPICS.length + " places, periods, and events documented so far.";
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
